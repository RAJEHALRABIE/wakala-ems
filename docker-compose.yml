# Wakala EMS - Docker Compose
# App + MySQL 8

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wakala-ems-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://wakala:wakala_password@db:3306/wakala_ems
      - JWT_SECRET=${JWT_SECRET}
      - LOGIN_ACCESS_CODE=${LOGIN_ACCESS_CODE:-BAREQ2030}
      - MASTER_KEY=${MASTER_KEY:-RAJ0579}
      - VITE_APP_ID=${VITE_APP_ID}
      - OAUTH_SERVER_URL=${OAUTH_SERVER_URL}
      - VITE_OAUTH_PORTAL_URL=${VITE_OAUTH_PORTAL_URL}
      - BUILT_IN_FORGE_API_URL=${BUILT_IN_FORGE_API_URL}
      - BUILT_IN_FORGE_API_KEY=${BUILT_IN_FORGE_API_KEY}
      - VITE_FRONTEND_FORGE_API_KEY=${VITE_FRONTEND_FORGE_API_KEY}
      - VITE_FRONTEND_FORGE_API_URL=${VITE_FRONTEND_FORGE_API_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wakala-network

  db:
    image: mysql:8.0
    container_name: wakala-ems-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=wakala_ems
      - MYSQL_USER=wakala
      - MYSQL_PASSWORD=wakala_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wakala-network

networks:
  wakala-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
